<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>PRO TAG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5a3d'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='white' font-style='italic'%3EPT%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/ui/styles.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="screen-flash"></div>
  <div id="ui">
    <div id="hud" class="hidden"></div>
    <div id="screens"></div>
  </div>
  <div id="touch" class="hidden"></div>
  <div id="toasts"></div>
  <div id="loading">
    <div class="ld-stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="ld-center">
      <h1 class="logo ld-logo">Pro Tag</h1>
      <div class="ld-tag">Chase · Evade · Tag</div>
      <div class="ld-progress">
        <div class="ld-bar"><i id="load-bar"><b></b></i></div>
        <div class="ld-row"><span id="load-msg">Loading…</span><span id="load-pct">0%</span></div>
      </div>
      <div class="ld-tip"><span>TIP</span><em id="load-tip"></em></div>
    </div>
    <div class="ld-ver" id="load-ver"></div>
  </div>
  <noscript>PRO TAG needs JavaScript enabled.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
